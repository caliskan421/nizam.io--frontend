# YALNIZ yerel web e2e veritabanı. Proje adı sabittir (paylaşılan makine kuralı):
#   docker compose -p nizamio_web_e2e -f e2e/backend/compose.yaml up -d --wait
#   docker compose -p nizamio_web_e2e -f e2e/backend/compose.yaml down -v
# CI'da bunun yerine GitHub Actions Postgres servis konteyneri kullanılır.
name: nizamio_web_e2e
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nizamio_e2e
    ports:
      - '127.0.0.1:${NIZAMIO_E2E_PG_PORT:-15432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nizamio_e2e']
      interval: 2s
      timeout: 3s
      retries: 30
