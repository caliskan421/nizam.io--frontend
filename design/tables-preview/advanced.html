<header class="atlas-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">R</span><strong>İleri tablo akışları</strong>
  </div>
  <button id="theme" type="button" class="t-btn t-btn--ghost t-btn--sm">Açık tema</button>
</header>
<div class="atlas">
  <p class="preview-hint">Yerel tasarım eklerinden alınan akışlar. Tüm kayıtlar örnektir.</p>
  <div class="controls">
    <label class="field">Senaryo<select id="scenario" class="t-select"></select></label>
    <label class="field"
      >Önizleme genişliği
      <select id="width" class="t-select">
        <option value="fluid">Akışkan</option>
        <option value="desktop">1440 px</option>
        <option value="phone">390 px</option>
      </select>
    </label>
  </div>
  <p class="preview-hint">Sabit genişliklerde çerçeveyi yatay kaydırabilirsiniz.</p>
  <div
    class="preview"
    id="preview"
    tabindex="0"
    role="region"
    aria-label="Örnek ekran önizlemesi"
  ></div>
</div>
