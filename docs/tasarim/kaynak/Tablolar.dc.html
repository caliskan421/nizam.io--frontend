<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>RoketPortal — Tablolar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tema-sistemi/tokens.css">
<link rel="stylesheet" href="tema-sistemi/bundle.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
/* Tablolar */
.rp-shtpls{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px}
.rp-shtpl{display:grid; grid-template-columns:36px minmax(0,1fr); gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--border-subtle); border-radius:14px; background:var(--bg-surface); color:var(--ink); font:inherit; text-align:left; cursor:pointer; transition:border-color .15s, background .15s}
.rp-shtpl:hover{border-color:var(--border-strong); background:var(--bg-raised)}
.rp-shtpl__ic{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:var(--bg-raised); color:var(--ink-muted)}
.rp-shtpl--blank .rp-shtpl__ic{background:var(--accent-text); color:var(--accent-ink)}
.rp-shtpl__body{display:flex; flex-direction:column; gap:2px; min-width:0}
.rp-shtpl__body strong{font-size:14px; font-weight:600}
.rp-shgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px}
.rp-shcard{display:flex; flex-direction:column; padding:0; border:1px solid var(--border-subtle); border-radius:16px; background:var(--bg-surface); color:var(--ink); font:inherit; text-align:left; cursor:pointer; overflow:hidden; transition:border-color .15s, transform .15s}
.rp-shcard:hover{border-color:var(--border-strong); transform:translateY(-2px)}
.rp-shcard:focus-visible{outline:2px solid var(--focus-ring); outline-offset:2px}
.rp-shprev{display:flex; flex-direction:column; padding:12px 14px; gap:0; background:var(--bg-base); border-bottom:1px solid var(--border-subtle); min-height:118px}
.rp-shprev__row{display:grid; gap:10px; align-items:center; height:26px; font-size:11.5px; color:var(--ink-muted); border-bottom:1px solid color-mix(in srgb, var(--ink) 6%, transparent)}
.rp-shprev__row:last-child{border-bottom:0}
.rp-shprev__row--head{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint)}
.rp-shprev__done{color:var(--accent-text)}
.rp-shcard__body{display:flex; flex-direction:column; gap:8px; padding:14px 16px 16px}
.rp-shcard--new{align-items:center; justify-content:center; gap:8px; min-height:230px; border-style:dashed; background:transparent; color:var(--ink-muted); font-weight:500}
.rp-shcard--new:hover{color:var(--ink); background:var(--bg-surface)}
.rp-shrole{display:inline-flex; align-items:center; height:18px; padding:0 6px; border:1px solid var(--border-strong); border-radius:5px; font-size:10px; font-weight:600; color:var(--ink-muted); flex:none}
.rp-shtitle{width:100%; min-width:0; margin:0; padding:2px 6px; margin-left:-6px; border:0; border-radius:8px; background:transparent; color:var(--ink); font-family:var(--font-display); font-size:30px; line-height:38px; font-weight:600; letter-spacing:-.01em}
.rp-shtitle:hover:not([readonly]){background:var(--bg-raised)}
.rp-shtitle:focus{outline:none; background:var(--bg-raised)}
.rp-shpeople{display:inline-flex; align-items:center; gap:6px; padding:4px 6px; border:0; border-radius:999px; background:none; color:inherit; font:inherit; cursor:pointer}
.rp-shpeople:hover{background:var(--bg-raised)}
.rp-shnote{display:flex; gap:10px; align-items:center; padding:10px 14px; border-radius:12px; background:var(--bg-raised); font-size:13px; color:var(--ink-muted)}
.rp-sh{border:1px solid var(--border-subtle); border-radius:14px; background:var(--bg-surface); overflow:visible}
.rp-sh__scroll{overflow-x:auto; overflow-y:visible; border-radius:14px; padding-bottom:180px; margin-bottom:-180px}
.rp-sh__table{display:flex; flex-direction:column}
.rp-sh__row{display:grid; align-items:stretch; min-height:40px; border-bottom:1px solid var(--border-subtle)}
.rp-sh__row:hover:not(.rp-sh__row--head):not(.rp-sh__row--foot){background:color-mix(in srgb, var(--ink) 3%, transparent)}
.rp-sh__row--head{min-height:38px; background:var(--bg-surface); position:relative; z-index:3}
.rp-sh__num{display:grid; place-items:center; position:relative; border-right:1px solid var(--border-subtle); font-family:var(--font-mono); font-size:11px; color:var(--ink-faint)}
.rp-sh__del{position:absolute; inset:0; margin:auto; width:28px; height:28px; display:none; place-items:center; border:0; border-radius:8px; background:none; color:var(--ink-muted); cursor:pointer}
.rp-sh__del:hover{background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger)}
.rp-sh__row:hover .rp-sh__del, .rp-sh__del:focus-visible{display:grid}
.rp-sh__row:hover .rp-sh__n{visibility:hidden}
.rp-sh__hcell{position:relative; border-right:1px solid var(--border-subtle); min-width:0}
.rp-sh__hcell--add{border-right:0}
.rp-sh__hbtn{display:flex; align-items:center; gap:7px; width:100%; height:100%; min-height:38px; padding:0 12px; border:0; background:none; color:var(--ink-muted); font:inherit; font-size:12.5px; font-weight:500; text-align:left; cursor:pointer}
.rp-sh__hbtn:hover, .rp-sh__hbtn[aria-expanded="true"]{background:var(--bg-raised); color:var(--ink)}
.rp-sh__hbtn .t-icon{flex:none; width:14px; height:14px; color:var(--ink-faint)}
.rp-sh__sort{margin-left:auto; color:var(--ink); font-size:12px}
.rp-sh__addcol{display:grid; place-items:center; width:38px; height:38px; border:0; background:none; color:var(--ink-faint); cursor:pointer; border-radius:8px}
.rp-sh__addcol:hover, .rp-sh__addcol[aria-expanded="true"]{color:var(--ink); background:var(--bg-raised)}
.rp-sh__menu{top:calc(100% + 4px); left:0; width:240px; padding:8px; display:flex; flex-direction:column; gap:2px; z-index:10}
.rp-sh__menu .rp-menuitem:disabled{opacity:.4; cursor:default}
.rp-sh__cell{position:relative; display:flex; align-items:center; border-right:1px solid var(--border-subtle); min-width:0}
.rp-sh__in{width:100%; height:100%; min-height:40px; padding:0 12px; border:0; background:transparent; color:var(--ink); font:inherit; font-size:13.5px; box-sizing:border-box}
.rp-sh__in.rp-mono{font-size:12.5px; color-scheme:dark}
:root[data-theme="light"] .rp-sh__in.rp-mono{color-scheme:light}
.rp-sh__in:focus{outline:none; box-shadow:inset 0 0 0 2px var(--accent-text); border-radius:2px; background:var(--bg-base)}
.rp-sh__in[readonly], .rp-sh__in:disabled{cursor:default}
.rp-sh__in[readonly]:focus{box-shadow:none; background:transparent}
.rp-sh__cell--todo{justify-content:center}
.rp-sh__todo{display:grid; place-items:center; width:100%; height:100%; cursor:pointer}
.rp-sh__addrow{display:flex; align-items:center; gap:8px; width:100%; height:40px; padding:0 16px; border:0; border-bottom:1px solid var(--border-subtle); background:none; color:var(--ink-faint); font:inherit; font-size:13px; text-align:left; cursor:pointer}
.rp-sh__addrow:hover{background:color-mix(in srgb, var(--ink) 3%, transparent); color:var(--ink)}
.rp-sh__row--foot{border-bottom:0; min-height:34px}
.rp-sh__calc{display:flex; align-items:center; padding:0 12px; font-size:11.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
.rp-shcols{display:flex; flex-direction:column; gap:8px}
.rp-shcols__row{display:grid; grid-template-columns:minmax(0,1fr) auto 32px; gap:8px; align-items:center}
.rp-shcols__row .rp-seg button{display:inline-flex; align-items:center; gap:5px}
.rp-shmem{display:flex; flex-direction:column; gap:2px; max-height:280px; overflow:auto}
.rp-shmem__row{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--border-subtle)}
.rp-shmem__row:last-child{border-bottom:0}
.rp-shpick{display:flex; flex-direction:column; gap:2px; margin-top:6px; padding:4px; border:1px solid var(--border-subtle); border-radius:12px; background:var(--bg-raised)}
@media (max-width: 720px){ .rp-shtitle{font-size:24px; line-height:30px} .rp-shcols__row{grid-template-columns:1fr 32px} .rp-shcols__row .rp-seg{grid-column:1 / -1; order:3} }
.rp-sh__cell--pick{padding:0}
.rp-sh__pick{display:flex; align-items:center; gap:8px; width:100%; height:100%; min-height:40px; padding:0 10px; border:0; background:none; color:var(--ink); font:inherit; font-size:13px; text-align:left; cursor:pointer; min-width:0}
.rp-sh__pick:hover:not(:disabled), .rp-sh__pick[aria-expanded="true"]{background:color-mix(in srgb, var(--ink) 5%, transparent)}
.rp-sh__pick:disabled{cursor:default}
.rp-sh__ph{color:var(--ink-faint); font-size:12.5px; opacity:0; transition:opacity .12s}
.rp-sh__row:hover .rp-sh__ph, .rp-sh__pick:focus-visible .rp-sh__ph{opacity:1}
.rp-sh__tag{flex:none; display:inline-grid; place-items:center; height:22px; min-width:22px; padding:0 6px; border-radius:6px; background:var(--bg-overlay); color:var(--ink-muted); font-family:var(--font-mono); font-size:10.5px; font-weight:600; box-sizing:border-box}
.rp-sh__tag--person{border-radius:50%; padding:0; width:22px; font-family:inherit; font-size:9.5px; color:var(--ink)}
.rp-sh__tag--task{color:color-mix(in srgb, #ff9142 80%, var(--ink)); background:color-mix(in srgb, #ff9142 14%, transparent)}
.rp-sh__pickmenu{width:300px}
.rp-sh__opts{display:flex; flex-direction:column; gap:1px; max-height:260px; overflow:auto}
.rp-sh__cell--open{z-index:5}
.rp-shcols__row .rp-seg button{padding:0 9px}
.rp-sh__addmenu{top:0; left:44px}
.rp-sh__rz{position:absolute; top:0; right:-4px; bottom:0; width:8px; z-index:4; cursor:col-resize; touch-action:none}
.rp-sh__rz::after{content:""; position:absolute; top:6px; bottom:6px; left:3px; width:2px; border-radius:1px; background:transparent; transition:background .12s}
.rp-sh__rz:hover::after, .rp-sh__rz--on::after{background:var(--accent-text); top:0; bottom:0}
.rp-sh__cell--rel{padding:0 6px 0 8px}
.rp-sh__rel{display:flex; align-items:center; gap:4px; flex-wrap:nowrap; overflow:hidden; min-width:0; width:100%; min-height:40px}
.rp-sh__relchip{flex:0 1 auto; display:inline-flex; align-items:center; gap:4px; max-width:100%; min-width:0; height:24px; padding:0 8px 0 6px; border:1px solid color-mix(in srgb, var(--ink) 12%, transparent); border-radius:6px; background:color-mix(in srgb, var(--ink) 5%, transparent); color:var(--ink); font:inherit; font-size:12px; cursor:pointer}
.rp-sh__relchip .t-icon{width:12px; height:12px; flex:none; color:var(--ink-faint)}
.rp-sh__relchip:hover{background:color-mix(in srgb, var(--ink) 11%, transparent); text-decoration:underline; text-underline-offset:2px}
.rp-sh__relchip--lock{border-style:dashed; color:var(--ink-muted)}
.rp-sh__relchip--lock .t-icon{display:none}
.rp-sh__relchip--lock::before{content:"🔒"; font-size:10px}
.rp-sh__reladd{flex:none; display:grid; place-items:center; width:24px; height:24px; margin-left:auto; border:0; border-radius:6px; background:none; color:var(--ink-faint); cursor:pointer; opacity:0; transition:opacity .12s}
.rp-sh__row:hover .rp-sh__reladd, .rp-sh__reladd:focus-visible, .rp-sh__reladd[aria-expanded="true"]{opacity:1}
.rp-sh__reladd:hover{background:var(--bg-raised); color:var(--ink)}
.rp-sh__relpick{display:flex; flex-direction:column; gap:1px; max-height:180px; overflow:auto; margin-top:2px; padding-top:2px; border-top:1px solid var(--border-subtle)}
.rp-shlinks{display:flex; flex-wrap:wrap; align-items:center; gap:8px; color:var(--ink-muted)}
.rp-sh__linkchip{display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border:1px solid var(--border-subtle); border-radius:999px; background:var(--bg-surface); color:var(--ink); font:inherit; font-size:12.5px; cursor:pointer}
.rp-sh__linkchip:hover{border-color:var(--border-strong); background:var(--bg-raised)}
.rp-sh__linkchip--lock{border-style:dashed; color:var(--ink-muted)}
.rp-sh__row--flash{animation:rpRowFlash 1.8s ease-out both}
@keyframes rpRowFlash{0%,35%{background:color-mix(in srgb, var(--gold) 18%, transparent); box-shadow:inset 3px 0 0 var(--gold)} 100%{background:transparent; box-shadow:inset 3px 0 0 transparent}}
.rp-hxchip{display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 4px 0 10px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--bg-raised); font-size:12px; color:var(--ink)}
.rp-hxchip button{display:grid; place-items:center; width:20px; height:20px; padding:0; border:0; border-radius:50%; background:none; color:var(--ink-muted); cursor:pointer}
.rp-hxchip button:hover{background:var(--bg-overlay); color:var(--ink)}
.rp-hxchip .t-icon{width:12px; height:12px}

.rp-av.rp-tip{position:relative; cursor:default}
.rp-tip::after{content:attr(data-tip); position:absolute; bottom:calc(100% + 8px); right:0; padding:4px 8px; border-radius:7px; background:var(--ink); color:var(--bg-base); font-size:11px; font-weight:500; letter-spacing:0; line-height:14px; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.25); opacity:0; transform:translateY(3px); transition:opacity .12s, transform .12s; pointer-events:none; z-index:6}
.rp-tip:hover, .rp-tip:focus-visible{z-index:3}
.rp-tip:hover::after, .rp-tip:focus-visible::after{opacity:1; transform:translateY(0)}
</style>
</helmet>
<div class="rp-page" data-theme="{{ theme }}">
<div class="rp-side"><dc-import name="Sidebar" active="sheets" hint-size="272px,1100px"></dc-import></div>
<main class="rp-main">

<div class="rp-topbar">
<div class="rp-navbtns" role="group" aria-label="Gezinme geçmişi"><button type="button" aria-label="Geri" title="Geri"><svg class="t-icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></button><button type="button" aria-label="İleri" title="İleri" disabled><svg class="t-icon" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg></button></div>
<nav class="rp-crumbs" aria-label="Konum"><a href="#">Şanlıurfa Teknofest</a><span aria-hidden="true">/</span><strong>Tablolar</strong></nav><span class="rp-grow"></span><button class="t-iconbtn rp-themebtn" type="button" aria-label="Temayı değiştir" title="Temayı değiştir"><svg class="t-icon t-icon--sm rp-ic-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path></svg><svg class="t-icon t-icon--sm rp-ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button><button class="t-iconbtn" type="button" aria-label="Bildirimler, 2 okunmamış" style="position:relative"><svg class="t-icon t-icon--sm" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span aria-hidden="true" style="position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--danger); box-shadow:0 0 0 2px var(--bg-base)"></span></button>
</div>
<div class="rp-head">
<div><h1 class="rp-h1">Tablolar</h1><p class="rp-sub">{{ sh.sub }}</p></div>
<div class="rp-actions"><button class="t-btn t-btn--primary" type="button" onClick="{{ sh.create }}"><svg class="t-icon t-icon--sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>Yeni tablo</button></div>
</div>
<div class="rp-body">
<div style="flex:1 1 100%; min-width:0; display:flex; flex-direction:column; gap:20px">
<div class="rp-toolbar">
<div class="rp-tgroup"><div class="rp-seg" role="group" aria-label="Tablo filtresi"><sc-for list="{{ sh.scopes }}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}">{{ o.label }} <span class="rp-count">{{ o.n }}</span></button></sc-for></div></div>
<span class="rp-grow"></span>
<div class="rp-tgroup"><div class="t-field" style="width:240px"><input class="t-input t-input--icon" type="search" value="{{ sh.q }}" onChange="{{ sh.setQ }}" placeholder="Tablo ara" aria-label="Tablo ara" style="height:36px"><svg class="t-icon t-icon--sm t-field__icon" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg></div></div>
</div>
<section aria-label="Şablonla başla" style="display:flex; flex-direction:column; gap:10px">
<span class="rp-kicker">hızlı başlangıç</span>
<div class="rp-shtpls">
<button type="button" class="rp-shtpl rp-shtpl--blank" onClick="{{ sh.create }}"><span class="rp-shtpl__ic" aria-hidden="true"><svg class="t-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span><span class="rp-shtpl__body"><strong>Boş tablo</strong><span class="rp-cap">Sütunları kendin belirle</span></span></button>
<sc-for list="{{ sh.tpls }}" as="t" hint-placeholder-count="3"><button type="button" class="rp-shtpl" onClick="{{ t.go }}"><span class="rp-shtpl__ic" aria-hidden="true"><svg class="t-icon" viewBox="0 0 24 24"><path d="{{ t.d }}"></path></svg></span><span class="rp-shtpl__body"><strong>{{ t.name }}</strong><span class="rp-cap rp-trunc">{{ t.cols }}</span></span></button></sc-for>
</div>
</section>
<section aria-label="Tablolarım" style="display:flex; flex-direction:column; gap:10px">
<span class="rp-kicker">{{ sh.listLabel }}</span>
<div class="rp-shgrid">
<sc-for list="{{ sh.cards }}" as="c" hint-placeholder-count="3">
<button type="button" class="rp-shcard" onClick="{{ c.open }}" aria-label="{{ c.title }} tablosunu aç">
<span class="rp-shprev" aria-hidden="true">
<span class="rp-shprev__row rp-shprev__row--head" style="grid-template-columns:{{ c.gtc }}"><sc-for list="{{ c.head }}" as="h" hint-placeholder-count="3"><span class="rp-trunc">{{ h.t }}</span></sc-for></span>
<sc-for list="{{ c.rows }}" as="r" hint-placeholder-count="3"><span class="rp-shprev__row" style="grid-template-columns:{{ c.gtc }}"><sc-for list="{{ r.cells }}" as="x" hint-placeholder-count="3"><span class="rp-trunc {{ x.cls }}">{{ x.t }}</span></sc-for></span></sc-for>
</span>
<span class="rp-shcard__body">
<span style="display:flex; align-items:center; gap:8px; min-width:0"><svg class="t-icon t-icon--sm" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--ink-muted); flex:none"><path d="M4 5h16v14H4zM4 10h16M4 15h16M10 5v14"></path></svg><strong class="rp-trunc" style="font-size:15px; font-weight:600">{{ c.title }}</strong><sc-if value="{{ c.isView }}" hint-placeholder-val="{{ false }}"><span class="rp-shrole">Görüntüleme</span></sc-if></span>
<span class="rp-cap rp-trunc">{{ c.meta }}</span>
<span style="display:flex; align-items:center; justify-content:space-between; gap:10px"><span class="rp-avstack"><sc-for list="{{ c.avs }}" as="p" hint-placeholder-count="3"><span class="rp-av rp-av--sm rp-tip" data-tip="{{ p.name }}" aria-label="{{ p.name }}" tabindex="0">{{ p.ini }}</span></sc-for></span><span class="rp-cap rp-nowrap">{{ c.when }}</span></span>
</span>
</button>
</sc-for>
<button type="button" class="rp-shcard rp-shcard--new" onClick="{{ sh.create }}"><svg class="t-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Yeni tablo</span></button>
</div>
<sc-if value="{{ sh.empty }}" hint-placeholder-val="{{ false }}"><div class="rp-empty">Bu filtrede tablo yok.</div></sc-if>
</section>
</div>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1100}}'>
