name: ci

# NIZAM.IO web istemcisi — kalite kapısı (F06 WEB-1a kapsam 11).
# Sıra: kurulum (kilit dosyası donuk) → üretim kapısı (spec etiketinden yeniden üret,
# diff = 0) → tip denetimi → lint (sınır kuralı dahil) → biçim → birim testleri → build.
#
# Backend deposu özeldir: salt okunur deploy key (BACKEND_DEPLOY_KEY) ile yalnız
# api-pin.json'daki ETİKET getirilir; frontend ağacının dışında tutulur (.backend/).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 'tsc · lint · vitest · build'
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm kur (packageManager alanından)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node kur (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Bağımlılıklar (--frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Backend API pinini oku (api-pin.json)
        id: pin
        run: echo "tag=$(jq -r .backendTag api-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Backend sözleşmesini etiketten getir (salt okunur deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caliskan421/nizam.io--backend
          ref: refs/tags/${{ steps.pin.outputs.tag }}
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: .backend
          fetch-depth: 1
          persist-credentials: false

      - name: 'Üretim kapısı: gen:api + gen:tokens yeniden üret, diff = 0'
        env:
          NIZAMIO_BACKEND_DIR: .backend
        run: |
          pnpm gen:api
          pnpm gen:tokens
          paths="src/shared/api src/shared/tokens"
          if ! git diff --exit-code -- $paths; then
            echo "::error::Üretilmiş dosyalar kaynakla (backend etiketi / tokens.json) uyuşmuyor; 'pnpm gen:api && pnpm gen:tokens' koşup commit'leyin."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- $paths)" ]; then
            git status --porcelain -- $paths
            echo "::error::Commit'lenmemiş üretilmiş dosya var."
            exit 1
          fi

      - name: Tip denetimi (vue-tsc, strict)
        run: pnpm typecheck

      - name: ESLint (sınır kuralı, depolama yasağı, elle DTO yasağı)
        run: pnpm lint

      - name: Biçim denetimi (prettier)
        run: pnpm format:check

      - name: Birim testleri (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: 'Paylaşılan daemon: e2e betiklerinde docker tag/rmi yok (genel etiket değişmez)'
        run: |
          # İmaj etiketleme/silme komutu hiç yok (yorum satırları hariç); konteyner `docker rm -f`
          # yalnız adı belirtilmiş nizamio_web_e2e* kaynaklarındadır.
          if grep -nE '^[^#]*docker[[:space:]]+((image[[:space:]]+)?tag|rmi|image[[:space:]]+(rm|prune)|system[[:space:]]+prune)([[:space:]]|$)' e2e/backend/*.sh; then
            echo "::error::e2e betiklerinde imaj etiketleme/silme komutu var"
            exit 1
          fi
          echo "e2e betiklerinde docker tag/rmi yok"

      - name: 'Ayrım: e2e ilk yönetici aracı yayın paketinde yok (dist/)'
        run: e2e/backend/check-isolation.sh dist

      - name: Bağımlılık denetimi (üretim bağımlılıkları)
        run: pnpm audit --prod

  e2e:
    name: 'Playwright duman (gerçek backend, etiket imajı)'
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          # CI'ya özel, tek kullanımlık servis konteyneri kimliği; sır değildir.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nizamio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nizamio_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NIZAMIO_E2E_MODE: ci
      NIZAMIO_BACKEND_DIR: .backend
      NIZAMIO_DEV_BACKEND: http://127.0.0.1:18080
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm kur (packageManager alanından)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node kur (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Bağımlılıklar (--frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Backend API pinini oku (api-pin.json)
        id: pin
        run: echo "tag=$(jq -r .backendTag api-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Backend etiketini getir (salt okunur deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caliskan421/nizam.io--backend
          ref: refs/tags/${{ steps.pin.outputs.tag }}
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: .backend
          fetch-depth: 1
          persist-credentials: false

      - name: 'Backend: etiketten docker build → roller → migrate → ilk yönetici → server'
        run: e2e/backend/up.sh

      - name: 'Ayrım: e2e ilk yönetici aracı backend çalışma imajında yok'
        run: e2e/backend/check-isolation.sh image

      - name: Playwright chromium kur
        run: pnpm exec playwright install --with-deps chromium

      - name: 'Duman + iki sekme: global setup (API ile fixture), giriş → /v1/me → çıkış, eşzamanlı 401 → tek refresh'
        run: pnpm e2e

      - name: Backend günlüğü (hata durumunda)
        if: failure()
        run: docker logs nizamio_web_e2e-server || true

      - name: Playwright raporu ve ekran görüntüsü
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Backend'i kapat
        if: always()
        run: e2e/backend/down.sh
